data:
  format: research_v2
  dataset_root: /mnt/disk_code/marques/resp_prepare/dataset/20260620_research_v2_resp_reconstruction_stage2_1_segrobustz_bcgstagee_log1psoftz_robustconf
  index_csv: training/dataset_index.csv
  input_set: research_v2_waveform
  train_split: train
  val_split: val
  test_split: test
  target_task: waveform
  bcg_input_key: bcg_rawish_segment_soft_z_key
  target_key: target_waveform_segment_soft_z_key
  max_train_windows: null
  max_val_windows: null
  max_test_windows: null
  filter_unusable: true
  drop_nonfinite_windows: false
  preload_windows: true
  train_sample_strategy: stratified_random
  val_sample_strategy: stratified_random
  test_sample_strategy: stratified_random
  train_sample_seed: 20260610
  val_sample_seed: 20260611
  test_sample_seed: 20260612
  stratify_column: allowed_losses
  min_hard_valid_ratio: 0.80
  min_state_alignment_valid_ratio: 0.80

window:
  target_fs: 100
  duration_samples: 18000
  duration_sec: 180

model:
  name: time_stft_dual1d
  experiment_variant: t4_g3c_bandenergy_native
  in_channels: 1
  out_channels: 1
  base_channels: 16
  time_backbone: patch_mixer1d
  patch_len: 256
  patch_stride: 128
  mixer_layers: 2
  overlap_window: hann
  output_smoothing_kernel: 1
  branch_mode: dual
  stft_win: 2000
  stft_hop: 250
  stft_low_hz: 0.05
  stft_high_hz: 8.0
  stft_out_channels: 16
  stft_norm: n0
  stft_encoder_type: bandenergy
  fusion_mode: native_inject
  stft_inject_position: pre_mixer

loss:
  band_low_hz: 0.05
  band_high_hz: 0.70
  scale_eps: 1.0e-8
  dynamic_eps: 1.0e-8
  corr_eps: 1.0e-8
  envelope_eps: 1.0e-8
  max_lag_sec: 0.30
  envelope_window_sec: 10
  envelope_step_sec: 5
  sync_weight: 1.0
  effort_weight: 0.25

evaluation:
  local_rr_window_sec: 60
  local_rr_step_sec: 15
  ibi_peak_distance_samples: 142
  ibi_match_tolerance_sec: 0.5
  ibi_coverage_threshold: 0.80
  ndtw_fs: 10
  ndtw_radius_sec: 0.30

training:
  epochs: 50
  batch_size: 128
  learning_rate: 0.001
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  weight_decay: 0.0
  num_workers: 0
  persistent_workers: false
  prefetch_factor: null
  seed: 20260811
  device: auto
  lr_scheduler: none
  grad_clip_norm: null
  use_amp: false
  show_progress: auto

outputs:
  run_root: runs/tho_restart_t4_g3c_bandenergy_native

protocol:
  name: paper-center-context-v1-20260901
  stage: p1_center_context
  run_role: implementation
  execution_gate: p1_implementation_only

data:
  format: research_v2
  dataset_root: /mnt/disk_code/marques/resp_prepare/dataset/20260620_research_v2_resp_reconstruction_stage2_1_segrobustz_bcgstagee_log1psoftz_robustconf
  index_csv: training/dataset_index.csv
  input_set: research_v2_waveform
  train_split: train
  val_split: val
  test_split: test
  access_splits: [train, val]
  target_task: waveform
  bcg_input_key: bcg_rawish_segment_soft_z_key
  target_key: target_waveform_segment_soft_z_key
  center_w_cache_path: null
  max_train_windows: 2
  max_val_windows: 2
  max_test_windows: null
  filter_unusable: true
  drop_nonfinite_windows: false
  preload_windows: false
  train_sample_strategy: stratified_random
  val_sample_strategy: stratified_random
  train_sample_seed: 20260610
  val_sample_seed: 20260611
  stratify_column: allowed_losses
  min_hard_valid_ratio: 0.80
  min_state_alignment_valid_ratio: 0.80

window:
  target_fs: 100
  parent_samples: 18000
  input_samples: 6000
  input_sec: 60
  output_samples: 6000
  output_sec: 60
  # ResearchV2WindowDataset 仍只读取冻结父窗口；中心裁剪由独立 wrapper 完成。
  duration_samples: 18000
  duration_sec: 180

model:
  name: paper_center_context_v1
  variant: c201_center60
  initialization_seed: ${training.seed}

loss:
  band_low_hz: 0.05
  band_high_hz: 0.70
  scale_eps: 1.0e-8
  dynamic_eps: 1.0e-8
  corr_eps: 1.0e-8
  envelope_eps: 1.0e-8
  max_lag_sec: 0.30
  envelope_window_sec: 10
  envelope_step_sec: 5
  sync_weight: 1.0
  effort_weight: 0.25

evaluation:
  ibi_peak_distance_samples: 142
  ibi_match_tolerance_sec: 0.5
  ibi_coverage_threshold: 0.80
  envelope_quantile_method: linear

training:
  optimizer: adamw
  epochs: 1
  batch_size: 2
  gradient_accumulation_steps: 1
  max_learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  adam_betas: [0.9, 0.999]
  adam_eps: 1.0e-8
  weight_decay: 1.0e-4
  warmup_fraction: 0.05
  lr_schedule: step_exact_warmup_cosine
  grad_clip_norm: 1.0
  use_amp: true
  amp_dtype: bfloat16
  drop_last: false
  resume: false
  early_stopping_enabled: false
  num_workers: 0
  persistent_workers: false
  prefetch_factor: null
  seed: 20260811
  device: cpu
  show_progress: false

outputs:
  run_root: runs/paper_evidence_v1/center_context/implementation_only
